plugins { id 'fabric-loom' version '1.10.5' }
version='0.3.0-beta.1'
group='com.zorykai.fishing'
repositories { mavenCentral(); maven { url='https://maven.fabricmc.net/' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.17.2'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
 modImplementation files('libs/cobblemon.jar')
 modCompileOnly files('libs/zorykaimenus.jar')
 modCompileOnly files('libs/impactor.jar')
 modImplementation 'me.lucko:fabric-permissions-api:0.3.1'
 include 'me.lucko:fabric-permissions-api:0.3.1'
 compileOnly 'net.kyori:adventure-key:4.17.0'
 compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
 implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
 include 'org.xerial:sqlite-jdbc:3.49.1.0'
 testImplementation platform('org.junit:junit-bom:5.12.2')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion=JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release=21; options.encoding='UTF-8' }
test { useJUnitPlatform() }
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand version:project.version } }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
sourceSets { integration { compileClasspath+=sourceSets.main.output+sourceSets.main.compileClasspath;runtimeClasspath+=sourceSets.main.output+sourceSets.main.runtimeClasspath } }
tasks.register('integrationJar',Jar){ dependsOn tasks.named('compileIntegrationJava'),tasks.named('processIntegrationResources');from sourceSets.integration.output;archiveClassifier='checks-dev' }
tasks.register('remapIntegrationJar',net.fabricmc.loom.task.RemapJarTask){dependsOn tasks.named('integrationJar'),tasks.named('remapJar');inputFile=tasks.named('integrationJar',Jar).flatMap{it.archiveFile};archiveClassifier='checks';addNestedDependencies.set(false);classpath.from(sourceSets.main.compileClasspath,sourceSets.main.output)}
